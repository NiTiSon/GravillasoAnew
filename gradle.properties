# Mindustry release version whose dependencies.jar is fetched from GitHub releases.
mindustryVersion = v160.6
# Javapoet, used by the annotations module to emit generated Java sources.
javapoetVersion = 1.12.1

# Mod meta, mirrored into mod/mod.hjson. `modName` becomes the region prefix (`modname-<sprite>`).
modName = gr
# Output JAR name. Desktop build is suffixed with `Desktop`.
modArtifact = GravillasoAnew
# Prefix for classes generated by the annotation processors (e.g. GravillasoContentRegionRegistry).
classPrefix = Gravillaso
# Package generated classes land in.
genPackage = nitis.gravillaso.gen

# Android
sdkVersion = 34
sdkAPI = 21

# Necessary internal API access for the annotation processors.
org.gradle.daemon = true
org.gradle.jvmargs = -Dfile.encoding=UTF-8 --add-opens=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.jvm=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-opens=java.base/sun.reflect.annotation=ALL-UNNAMED